<section class="relative overflow-hidden bg-gradient-to-br from-[#1a3d52] via-[#2c5f7a] to-[#1a3d52] rounded-2xl shadow-xl border border-[#ff6b4a]/20 mx-4 mt-4 mb-6">
    <!-- Efectos decorativos de fondo -->
    <div class="absolute inset-0 opacity-15">
        <!--Circulos decorativos-->
        <div class="absolute top-0 right-0 w-96 h-96 bg-[#ff6b4a] rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-[#4a9eff] rounded-full blur-3xl translate-y-1/2 -translate-x-1/3"></div>
        <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-[#ff8b6a] rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>

        <!--Cuadicula decorativa-->
        <div class="absolute inset-0" style="background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px;"></div>
    </div>

    <!--Linea decorativa superior-->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#ff6b4a] via-[#4a9eff] to-[#ff6b4a]"></div>

    <div class="relative z-10 px-6 py-6 md:px-10 md:py-8">
        <div class="flex flex-col items-center text-center max-w-4xl mx-auto">
            <!--Logo y badge-->
            <div class="flex items-center gap-3 mb-4">
                <div class="flex gap-1">
                    <span class="inline-block w-3 h-3 bg-[#ff6b4a] rounded-full animate-pulse"></span>
                    <span class="inline-block w-3 h-3 bg-[#4a9eff] rounded-full"></span>
                    <span class="inline-block w-3 h-3 bg-[#ff6b4a] rounded-full animate-pulse"></span>
                </div>
                <span class="text-xs font-medium text-[#ffd4c8] uppercase tracking-wider bg-[#ff6b4a]/10 px-3 py-1 rounded-full border border-[#ff6b4a]/20">
                    Unidad de Seguimiento
                </span>
            </div>

            <!--Titulo principal con icono decorativo-->
            <div class="flex items-center gap-4 mb-3">
                <div class="hidden md:block w-12 h-px bg-gradient-to-r from-transparent to-[#ff6b4a]/50"></div>
                <h1 class="text-2xl md:text-4xl font-bold text-white">
                    <span class="bg-gradient-to-r from-[#ff8b6a] to-[#ffa890] bg-clip-text text-transparent">
                        USEGBE
                    </span>
                </h1>
                <div class="hidden md:block w-12 h-px bg-gradient-to-l from-transparent to-[#ff6b4a]/50"></div>
            </div>

            <!--Subtitulo-->
            <p class="text-sm md:text-lg text-[#b3d9f2] font-medium mb-2">
                Unidad de Seguimiento a Egresado, Graduados y Bolsa de Empleo
            </p>

            <!--Linea decorativa-->
            <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-[#ff6b4a] to-transparent rounded-full mb-3"></div>

            <!--Descripcion-->
            <p class="text-xs md:text-sm text-white max-w-2xl">
                Herramienta para la gestión y visualización de datos de seguimiento a egresados,
                graduados y resultados de encuestas de empleabilidad.
            </p>

            <!--Frase institucional-->
            <div class="mt-4 flex items-center gap-3">
                <span class="text-[10px] text-white uppercase tracking-widest">✦</span>
                <span class="text-xs text-white italic">
                    "Comprometidos con el bienestar estudiantil"
                </span>
                <span class="text-[10px] text-white uppercase tracking-widest">✦</span>
            </div>
        </div>
    </div>
</section>
